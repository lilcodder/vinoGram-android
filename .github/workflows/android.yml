name: vinoGram Android

on:
  push:
    branches: [codex/android-mvp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      VINOGRAM_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      VINOGRAM_KEY_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      VINOGRAM_KEY_ALIAS: vinogram
      VINOGRAM_KEYSTORE: ${{ github.workspace }}/.signing/release.keystore
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check build credentials
        shell: bash
        run: |
          test -n "$TELEGRAM_API_ID"
          test -n "$TELEGRAM_API_HASH"
          test -n "$VINOGRAM_STORE_PASSWORD"
      - name: Fetch pinned source dependencies
        run: git submodule update --init --depth 1 --jobs 4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reserve linker swap space
        run: |
          sudo fallocate -l 4G /mnt/vinogram-android.swap
          sudo chmod 600 /mnt/vinogram-android.swap
          sudo mkswap /mnt/vinogram-android.swap
          sudo swapon /mnt/vinogram-android.swap
      - name: Restore native build cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: TMessagesProj/.cxx
          key: android-native-${{ runner.os }}-${{ hashFiles('TMessagesProj/jni/**', '.gitmodules', 'TMessagesProj/build.gradle') }}
          restore-keys: android-native-${{ runner.os }}-
      - name: Prepare Xray and signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 Tools/prepare_xray.py
          mkdir -p .signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$VINOGRAM_KEYSTORE"
          test -s "$VINOGRAM_KEYSTORE"
      - name: Test subscription parser and engine
        run: python3 Tools/subscription/test.py
      - name: Compile Android Java sources
        run: ./gradlew :TMessagesProj_AppStandalone:compileAfatStandaloneJavaWithJavac --no-daemon --stacktrace --max-workers=2
      - name: Assemble signed ARM64 APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --no-daemon --stacktrace --max-workers=2
      - name: Verify and stage APK
        run: |
          mkdir -p dist
          cp TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk dist/vinoGram-0.1.0-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/vinoGram-0.1.0-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/vinoGram-0.1.0-arm64.apk > dist/apk-info.txt
          grep -q 'org.vinogram.messenger.web' dist/apk-info.txt
          unzip -l dist/vinoGram-0.1.0-arm64.apk | grep 'lib/arm64-v8a/libxray.so'
          cd dist && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vinoGram-Android-0.1.0-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Save native intermediates for the next build
        if: always() && steps.native-cache.outputs.cache-primary-key != '' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: TMessagesProj/.cxx
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$VINOGRAM_KEYSTORE"
